name: tests
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (mock and real backends; the PyBullet twin tests are skipped)
        run: pip install numpy matplotlib pyserial
      - name: Smoke tests
        run: python tests/test_smoke.py
